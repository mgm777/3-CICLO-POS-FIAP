apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  namespace: togglemaster
  labels:
    app: analytics-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics-service
  template:
    metadata:
      labels:
        app: analytics-service
    spec:
      # KSA vinculada a uma Google Service Account por Workload Identity:
      # o pod autentica no GCP sem nenhuma chave JSON montada.
      serviceAccountName: analytics-service-ksa
      containers:
        - name: analytics-service
          # A tag abaixo e reescrita automaticamente pelo job gitops-update
          # do pipeline de CI. Nao edite a mao.
          image: us-central1-docker.pkg.dev/fiap-3-508723/analytics-service/analytics-service:v1.0.0-init
          ports:
            - containerPort: 8005
          env:
            - name: PORT
              value: "8005"
            - name: GCP_PROJECT_ID
              valueFrom:
                configMapKeyRef:
                  name: togglemaster-config
                  key: GCP_PROJECT_ID
            - name: PUBSUB_SUBSCRIPTION_ID
              valueFrom:
                configMapKeyRef:
                  name: togglemaster-config
                  key: PUBSUB_SUBSCRIPTION_ID
            - name: FIRESTORE_COLLECTION
              valueFrom:
                configMapKeyRef:
                  name: togglemaster-config
                  key: FIRESTORE_COLLECTION
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8005
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8005
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
