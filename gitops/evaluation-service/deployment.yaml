apiVersion: apps/v1
kind: Deployment
metadata:
  name: evaluation-service
  namespace: togglemaster
  labels:
    app: evaluation-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: evaluation-service
  template:
    metadata:
      labels:
        app: evaluation-service
    spec:
      serviceAccountName: evaluation-service-ksa
      containers:
        - name: evaluation-service
          image: us-central1-docker.pkg.dev/fiap-3-508723/evaluation-service/evaluation-service:v1.0.0-4a46a1f
          ports:
            - containerPort: 8004
          env:
            - name: PORT
              value: "8004"
            - name: FLAG_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: togglemaster-config
                  key: FLAG_SERVICE_URL
            - name: TARGETING_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: togglemaster-config
                  key: TARGETING_SERVICE_URL
            - name: GCP_PROJECT_ID
              valueFrom:
                configMapKeyRef:
                  name: togglemaster-config
                  key: GCP_PROJECT_ID
            - name: PUBSUB_TOPIC_ID
              valueFrom:
                configMapKeyRef:
                  name: togglemaster-config
                  key: PUBSUB_TOPIC_ID
          envFrom:
            - secretRef:
                name: evaluation-service-secret
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
