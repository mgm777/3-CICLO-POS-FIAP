apiVersion: apps/v1
kind: Deployment
metadata:
  name: targeting-service
  namespace: togglemaster
  labels:
    app: targeting-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: targeting-service
  template:
    metadata:
      labels:
        app: targeting-service
    spec:
      # KSA vinculada a uma Google Service Account por Workload Identity:
      # o pod autentica no GCP sem nenhuma chave JSON montada.
      serviceAccountName: targeting-service-ksa
      containers:
        - name: targeting-service
          # A tag abaixo e reescrita automaticamente pelo job gitops-update
          # do pipeline de CI. Nao edite a mao.
          image: us-central1-docker.pkg.dev/fiap-3-508723/targeting-service/targeting-service:v1.0.0-35de366
          ports:
            - containerPort: 8003
          env:
            - name: PORT
              value: "8003"
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: togglemaster-config
                  key: AUTH_SERVICE_URL
          envFrom:
            - secretRef:
                name: targeting-service-secret
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
