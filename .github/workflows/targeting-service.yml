name: targeting-service

on:
  pull_request:
    paths:
      - "services/targeting-service/**"
      - ".github/workflows/targeting-service.yml"
      - ".github/workflows/reusable-python-ci.yml"
  push:
    branches: [main]
    paths:
      - "services/targeting-service/**"
      - ".github/workflows/targeting-service.yml"
      - ".github/workflows/reusable-python-ci.yml"
  workflow_dispatch:

jobs:
  ci:
    uses: ./.github/workflows/reusable-python-ci.yml
    with:
      service_name: targeting-service
      service_path: services/targeting-service
    secrets: inherit
