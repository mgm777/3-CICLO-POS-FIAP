name: auth-service

on:
  pull_request:
    paths:
      - "services/auth-service/**"
      - ".github/workflows/auth-service.yml"
      - ".github/workflows/reusable-go-ci.yml"
  push:
    branches: [main]
    paths:
      - "services/auth-service/**"
      - ".github/workflows/auth-service.yml"
      - ".github/workflows/reusable-go-ci.yml"
  workflow_dispatch: # permite disparar a mao durante a demonstracao

jobs:
  ci:
    uses: ./.github/workflows/reusable-go-ci.yml
    with:
      service_name: auth-service
      service_path: services/auth-service
    secrets: inherit
