name: auth-service

on:
  pull_request:
    paths:
      - "services/auth-service/**"
      - ".github/workflows/auth-service.yml"
      - ".github/workflows/reusable-go-ci.yml"
      - ".golangci.yml"
  push:
    branches: [main]
    paths:
      - "services/auth-service/**"
      - ".github/workflows/auth-service.yml"
      - ".github/workflows/reusable-go-ci.yml"
      - ".golangci.yml"
  workflow_dispatch:

jobs:
  ci:
    uses: ./.github/workflows/reusable-go-ci.yml
    with:
      service_name: auth-service
      service_path: services/auth-service
      go_version: "1.25"
    secrets: inherit
