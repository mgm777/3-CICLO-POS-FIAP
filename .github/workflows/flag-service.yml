name: flag-service

on:
  pull_request:
    paths:
      - "services/flag-service/**"
      - ".github/workflows/flag-service.yml"
      - ".github/workflows/reusable-python-ci.yml"
  push:
    branches: [main]
    paths:
      - "services/flag-service/**"
      - ".github/workflows/flag-service.yml"
      - ".github/workflows/reusable-python-ci.yml"
  workflow_dispatch:

jobs:
  ci:
    uses: ./.github/workflows/reusable-python-ci.yml
    with:
      service_name: flag-service
      service_path: services/flag-service
    secrets: inherit
