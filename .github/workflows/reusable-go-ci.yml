name: Reusable - Go CI (DevSecOps)

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
      service_path:
        required: true
        type: string
      go_version:
        required: false
        type: string
        default: "1.21"

permissions:
  contents: write # job gitops-update commita a nova tag neste repo
  id-token: write # OIDC para o Workload Identity Federation do GCP

jobs:
  # 1. Build & Unit Test -------------------------------------------------------
  build-test:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.service_path }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go_version }}
          cache-dependency-path: ${{ inputs.service_path }}/go.sum
      - name: go build
        run: go build ./...
      - name: go test
        run: go test ./... -v

  # 2. Linter / Static Analysis ------------------------------------------------
  lint:
    name: Linter/Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go_version }}
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61
          working-directory: ${{ inputs.service_path }}
          args: --timeout=5m

  # 3. Security Scan (SAST & SCA) ----------------------------------------------
  security-scan:
    name: "Security Scan (SAST & SCA)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go_version }}

      # SAST: analisa o codigo-fonte em busca de padroes inseguros.
      # Bloqueia em severidade HIGH com confianca HIGH. Exclusoes documentadas:
      #   G104 - erro nao tratado (coberto pelo linter, nao e vulnerabilidade)
      #   G115 - conversao de inteiro; falso positivo em conversao de tamanho
      #   G704 - "SSRF": as URLs vem de ConfigMap interno, nao de input do usuario
      - name: SAST - gosec (bloqueia em HIGH)
        working-directory: ${{ inputs.service_path }}
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -severity high -confidence high -exclude=G104,G115,G704 ./...

      - name: SAST - gosec (relatorio completo, nao bloqueia)
        if: always()
        working-directory: ${{ inputs.service_path }}
        continue-on-error: true
        run: gosec ./...

      # SCA: analisa as dependencias declaradas no go.mod/go.sum.
      # REGRA DE BLOQUEIO: qualquer CVE CRITICAL falha o pipeline aqui e o
      # job docker-build-push (que depende deste) nem chega a rodar.
      - name: SCA - Trivy filesystem (bloqueia em CRITICAL)
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          scan-type: fs
          scan-ref: ${{ inputs.service_path }}
          scanners: vuln
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      # Relatorio informativo de HIGH — visivel no log, sem quebrar o build.
      - name: SCA - Trivy filesystem (relatorio HIGH)
        if: always()
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          scan-type: fs
          scan-ref: ${{ inputs.service_path }}
          scanners: vuln
          severity: HIGH
          exit-code: "0"
          ignore-unfixed: true

  # 4. Docker Build & Push -----------------------------------------------------
  docker-build-push:
    name: Docker Build & Push
    needs: [build-test, lint, security-scan]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Define a tag da imagem
        id: tag
        run: echo "image_tag=v1.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build da imagem
        working-directory: ${{ inputs.service_path }}
        run: docker build -t ${{ inputs.service_name }}:${{ steps.tag.outputs.image_tag }} .

      # Container Scan: a imagem final (base + libs do SO) tambem e auditada.
      - name: Container Scan - Trivy image (bloqueia em CRITICAL)
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          image-ref: ${{ inputs.service_name }}:${{ steps.tag.outputs.image_tag }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      # Autenticacao sem chave: troca o token OIDC do GitHub por um token de
      # curta duracao do GCP (Workload Identity Federation).
      - name: Autentica no GCP (OIDC / WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SERVICE_ACCOUNT }}

      - name: Login no Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Push para o Artifact Registry
        run: |
          IMAGE_URI="${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ inputs.service_name }}/${{ inputs.service_name }}:${{ steps.tag.outputs.image_tag }}"
          docker tag ${{ inputs.service_name }}:${{ steps.tag.outputs.image_tag }} "$IMAGE_URI"
          docker push "$IMAGE_URI"
          echo "Imagem publicada: $IMAGE_URI"

  # 5. GitOps: atualiza a tag no manifesto ------------------------------------
  # O pipeline NAO faz kubectl apply. Ele so commita a nova tag; quem aplica
  # no cluster e o ArgoCD, que observa a pasta gitops/.
  gitops-update:
    name: Atualiza a tag no GitOps
    needs: docker-build-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Reescreve a tag em gitops/${{ inputs.service_name }}/deployment.yaml
        run: |
          set -euo pipefail
          FILE="gitops/${{ inputs.service_name }}/deployment.yaml"
          NEW_TAG="${{ needs.docker-build-push.outputs.image_tag }}"
          sed -i -E "s|(image: .*/${{ inputs.service_name }}:).*|\1${NEW_TAG}|" "$FILE"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git diff --cached --quiet && { echo "Nada mudou"; exit 0; }
          git commit -m "chore(gitops): ${{ inputs.service_name }} -> ${NEW_TAG}"
          # Outro servico pode ter commitado enquanto este job rodava.
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            sleep 5
          done
          exit 1
